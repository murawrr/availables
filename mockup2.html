<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Option 2 — glazed ceramic</title>
<link rel="stylesheet" href="style.css">
<style>
    .badge {
        position: fixed; top: 0.5rem; left: 50%; transform: translateX(-50%);
        background: #2d362f; color: #edf2ee; padding: 0.3rem 0.9rem;
        font-size: 0.72rem; letter-spacing: 0.5px; border-radius: 999px; z-index: 9000;
    }
    .stage { display: flex; justify-content: center; padding: 1.75rem 1rem 5rem; }
    .vase-wrap { position: relative; width: min(82vw, 340px); }
    .vase-wrap svg { display: block; width: 100%; height: auto; overflow: visible;
        filter: drop-shadow(0 22px 26px rgba(35,45,40,0.30)); }
    .menu-item {
        position: absolute; left: 0; right: 0; text-align: center;
        transform: translateY(-50%);
        font-family: 'Noto Serif KR', Georgia, serif; font-weight: 600;
        color: #1f2a24; text-decoration: none; cursor: pointer;
        text-shadow: 0 1px 0 rgba(255,255,255,0.22);
        transition: opacity 0.2s ease;
    }
    .menu-item:hover { opacity: 0.55; }
    .mi-1 { font-size: clamp(1rem,4.4vw,1.35rem); letter-spacing: 2px; }
    .mi-2 { font-size: clamp(1.8rem,8vw,2.6rem); letter-spacing: 1px; color: #eef3ef; text-shadow: 0 1px 3px rgba(0,0,0,0.35); }
    .mi-3 { font-size: clamp(1.5rem,6.5vw,2.1rem); }
    .mi-4 { font-size: clamp(1.3rem,5.6vw,1.8rem); }
    .mi-5 { font-size: clamp(1.05rem,4.6vw,1.4rem); letter-spacing: 1px; }
</style>
</head>
<body>
    <span class="badge">Option 2 · glazed ceramic w/ depth</span>
    <header class="site-header">
        <div class="header-left"><a href="index.html" class="site-name">mura</a></div>
        <div class="header-right"><span class="header-action">예약 혹은 문의</span></div>
    </header>

    <main class="stage">
        <div class="vase-wrap" id="wrap">
            <svg id="svg" viewBox="0 0 360 600" preserveAspectRatio="xMidYMid meet">
                <defs>
                    <linearGradient id="glaze" x1="0.15" y1="0.05" x2="0.85" y2="1">
                        <stop offset="0" stop-color="#cad9cf"/>
                        <stop offset="0.45" stop-color="#9fb4a8"/>
                        <stop offset="1" stop-color="#7c9286"/>
                    </linearGradient>
                    <clipPath id="vaseclip"><path id="clippath"></path></clipPath>
                    <filter id="soft"><feGaussianBlur stdDeviation="10"/></filter>
                </defs>
                <path id="body" fill="url(#glaze)"></path>
                <g clip-path="url(#vaseclip)">
                    <!-- darker inlaid belly band (echoes the mini-tattoos accent) -->
                    <rect x="0" y="232" width="360" height="92" fill="#2f3a33" opacity="0.92"/>
                    <!-- glaze highlight -->
                    <ellipse cx="135" cy="180" rx="70" ry="120" fill="#ffffff" opacity="0.20" filter="url(#soft)"/>
                    <!-- faint inlaid medallions -->
                    <g fill="none" stroke="#eef3ef" stroke-width="1.1" opacity="0.16">
                        <circle cx="120" cy="380" r="15"/><circle cx="180" cy="410" r="15"/>
                        <circle cx="240" cy="380" r="15"/><circle cx="150" cy="455" r="13"/>
                        <circle cx="210" cy="455" r="13"/><circle cx="180" cy="500" r="12"/>
                    </g>
                </g>
            </svg>
            <a class="menu-item mi-1" style="top:30.5%">공지사항</a>
            <a class="menu-item mi-2" style="top:42%">미니 타투</a>
            <a class="menu-item mi-3" style="top:53.5%">에피소드</a>
            <a class="menu-item mi-4" style="top:65%">무라체</a>
            <a class="menu-item mi-5" style="top:76.5%">아카이브</a>
        </div>
    </main>

    <script>
    const PTS = [
        [0.000,0.150],[0.020,0.200],[0.045,0.150],[0.080,0.140],
        [0.150,0.420],[0.230,0.760],[0.300,0.940],[0.345,0.975],
        [0.430,0.955],[0.540,0.830],[0.650,0.680],[0.750,0.560],
        [0.840,0.495],[0.890,0.480],[0.930,0.560],[0.970,0.660],[1.000,0.640]
    ];
    function crom(P, p){
        if(p<=P[0][0]) return P[0][1];
        if(p>=P[P.length-1][0]) return P[P.length-1][1];
        let i=0; while(i<P.length-1 && p>P[i+1][0]) i++;
        const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(P.length-1,i+2)];
        const t=(p-p1[0])/(p2[0]-p1[0]),t2=t*t,t3=t2*t;
        return 0.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3);
    }
    function vasePath(cx, top, W, H){
        const N=200, r=[], l=[];
        for(let i=0;i<=N;i++){ const p=i/N, y=top+p*H, w=crom(PTS,p)*(W/2); r.push([cx+w,y]); l.push([cx-w,y]); }
        let d='M '+r[0][0].toFixed(1)+' '+r[0][1].toFixed(1);
        for(let i=1;i<r.length;i++) d+=' L '+r[i][0].toFixed(1)+' '+r[i][1].toFixed(1);
        for(let i=l.length-1;i>=0;i--) d+=' L '+l[i][0].toFixed(1)+' '+l[i][1].toFixed(1);
        return d+' Z';
    }
    const d = vasePath(180, 18, 300, 564);
    document.getElementById('body').setAttribute('d', d);
    document.getElementById('clippath').setAttribute('d', d);
    </script>
</body>
</html>
