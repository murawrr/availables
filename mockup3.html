<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Option 3 — abstract / typographic</title>
<link rel="stylesheet" href="style.css">
<style>
    .badge {
        position: fixed; top: 0.5rem; left: 50%; transform: translateX(-50%);
        background: #2d362f; color: #edf2ee; padding: 0.3rem 0.9rem;
        font-size: 0.72rem; letter-spacing: 0.5px; border-radius: 999px; z-index: 9000;
    }
    .stage { position: relative; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 1.1rem; padding: 3rem 1rem 6rem; min-height: 70vh; }
    /* faint vase silhouette the eye only half-notices */
    .ghost { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
        width: min(80vw, 330px); height: auto; opacity: 0.06; pointer-events: none; }
    .ghost path { fill: #2d362f; }
    .t-item {
        position: relative; text-align: center; text-decoration: none; cursor: pointer;
        font-family: 'Noto Serif KR', Georgia, serif; font-weight: 600; color: #2d362f;
        line-height: 1; transition: opacity 0.2s ease, letter-spacing 0.2s ease;
    }
    .t-item:hover { opacity: 0.5; letter-spacing: 4px; }
    /* size echoes the vase width at each height: neck → belly → foot */
    .t-1 { font-size: clamp(1.05rem,4.6vw,1.45rem); letter-spacing: 4px; color:#6f7b74; }
    .t-2 { font-size: clamp(2.2rem,10vw,3.3rem); letter-spacing: 1px; }
    .t-3 { font-size: clamp(1.7rem,7.6vw,2.5rem); letter-spacing: 1px; }
    .t-4 { font-size: clamp(1.35rem,6vw,1.95rem); letter-spacing: 2px; }
    .t-5 { font-size: clamp(1.05rem,4.6vw,1.45rem); letter-spacing: 4px; color:#6f7b74; }
</style>
</head>
<body>
    <span class="badge">Option 3 · abstract / typographic</span>
    <header class="site-header">
        <div class="header-left"><a href="index.html" class="site-name">mura</a></div>
        <div class="header-right"><span class="header-action">예약 혹은 문의</span></div>
    </header>

    <main class="stage">
        <svg class="ghost" viewBox="0 0 360 600" preserveAspectRatio="xMidYMid meet">
            <path id="ghostpath"></path>
        </svg>
        <a class="t-item t-1">공지사항</a>
        <a class="t-item t-2">미니 타투</a>
        <a class="t-item t-3">에피소드</a>
        <a class="t-item t-4">무라체</a>
        <a class="t-item t-5">아카이브</a>
    </main>

    <script>
    const PTS = [
        [0.000,0.150],[0.020,0.200],[0.045,0.150],[0.080,0.140],
        [0.150,0.420],[0.230,0.760],[0.300,0.940],[0.345,0.975],
        [0.430,0.955],[0.540,0.830],[0.650,0.680],[0.750,0.560],
        [0.840,0.495],[0.890,0.480],[0.930,0.560],[0.970,0.660],[1.000,0.640]
    ];
    function crom(P, p){
        if(p<=P[0][0]) return P[0][1];
        if(p>=P[P.length-1][0]) return P[P.length-1][1];
        let i=0; while(i<P.length-1 && p>P[i+1][0]) i++;
        const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(P.length-1,i+2)];
        const t=(p-p1[0])/(p2[0]-p1[0]),t2=t*t,t3=t2*t;
        return 0.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3);
    }
    function vasePath(cx, top, W, H){
        const N=200, r=[], l=[];
        for(let i=0;i<=N;i++){ const p=i/N, y=top+p*H, w=crom(PTS,p)*(W/2); r.push([cx+w,y]); l.push([cx-w,y]); }
        let d='M '+r[0][0].toFixed(1)+' '+r[0][1].toFixed(1);
        for(let i=1;i<r.length;i++) d+=' L '+r[i][0].toFixed(1)+' '+r[i][1].toFixed(1);
        for(let i=l.length-1;i>=0;i--) d+=' L '+l[i][0].toFixed(1)+' '+l[i][1].toFixed(1);
        return d+' Z';
    }
    document.getElementById('ghostpath').setAttribute('d', vasePath(180, 18, 300, 564));
    </script>
</body>
</html>
