<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow, noai, noimageai">
    <title>Archives - mura</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="site-header"></div>

    <main class="container">
        <section class="project">
            <div class="project-desc">
                <span class="desc-label">
                    <span class="dot"></span>
                    <span data-en="ARCHIVES" data-ko="아카이브">ARCHIVES</span>
                </span>
                <p data-en="These are sold-out non-repeatable designs. Browse these for reference if you would like something in a similar style."
                   data-ko="작업 완료된 도안들입니다. 비슷한 스타일을 원하시면 참고해 주세요.">Sold-out, non-repeatable designs. Browse these for reference if you would like something in a similar style.</p>
            </div>

            <!-- Add sold-out designs to images/archives/ : 01.jpg, 02.jpg ... -->
            <!-- The grid is built from gallery.js (window.GALLERY.archive). -->
            <div class="image-grid" data-collection="archive"></div>
        </section>
    </main>

    <script src="gallery.js"></script>
    <script src="script.js"></script>
</body>
</html>
