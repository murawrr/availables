<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>무라 - Mura Tattoo Artist</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Language Toggle -->
    <div class="lang-selector">
        <button class="lang-btn active" onclick="setLanguage('ko')" data-lang="ko">한국어</button>
        <button class="lang-btn" onclick="setLanguage('en')" data-lang="en">English</button>
        <button class="lang-btn" onclick="setLanguage('jp')" data-lang="jp">日本語</button>
    </div>

    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>무라</h1>
            <p class="tagline" data-en="Tattoo Artist" data-ko="타투 아티스트" data-jp="タトゥーアーティスト">타투 아티스트</p>
        </header>

        <!-- Horizontal Scroll Menu -->
        <div class="menu-scroll">
            <div class="menu-items">
                <div class="menu-item" style="background-color: #6B5B95;">
                    <span data-en="Episodes" data-ko="에피소드" data-jp="エピソード">에피소드</span>
                </div>
                <div class="menu-item" style="background-color: #9B8BA8;">
                    <span data-en="Mura-Types" data-ko="뮤라-타입" data-jp="ムラ-タイプ">뮤라-타입</span>
                </div>
                <div class="menu-item" style="background-color: #8B7BA8;">
                    <span data-en="Gallery" data-ko="갤러리" data-jp="ギャラリー">갤러리</span>
                </div>
                <div class="menu-item" style="background-color: #A8D5D5;">
                    <span data-en="About" data-ko="소개" data-jp="について">소개</span>
                </div>
                <div class="menu-item" style="background-color: #B8D5C8;">
                    <span data-en="Contact" data-ko="연락" data-jp="お問い合わせ">연락</span>
                </div>
                <div class="menu-item" style="background-color: #CAFCE1;">
                    <span data-en="Join Waitlist" data-ko="대기열 참가" data-jp="ウェイトリストに参加">대기열 참가</span>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <main>
            <!-- Intro Section -->
            <section class="intro-section">
                <p data-en="Welcome to 무라's tattoo design studio. Custom designs, custom stories." data-ko="무라의 타투 디자인 스튜디오에 오신 것을 환영합니다." data-jp="무라のタトゥーデザインスタジオへようこそ。">무라의 타투 디자인 스튜디오에 오신 것을 환영합니다.</p>
            </section>

            <!-- Waitlist Form Section -->
            <section class="waitlist-section">
                <h2 data-en="Join the Waitlist" data-ko="대기열에 참가하세요" data-jp="ウェイトリストに参加">대기열에 참가하세요</h2>
                
                <form class="waitlist-form" id="waitlistForm" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name" data-en="Name" data-ko="이름" data-jp="名前">이름</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="instagram" data-en="Instagram @" data-ko="인스타그램 @" data-jp="Instagram @">인스타그램 @</label>
                            <input type="text" id="instagram" name="instagram" placeholder="@username" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="city" data-en="City" data-ko="도시" data-jp="都市">도시</label>
                            <input type="text" id="city" name="city" required>
                        </div>
                        <div class="form-group">
                            <label for="country" data-en="Country" data-ko="국가" data-jp="国">국가</label>
                            <input type="text" id="country" name="country" required>
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label for="design" data-en="Design You Want & Approx Size" data-ko="원하는 디자인 및 대략적인 크기" data-jp="欲しいデザインと大まかなサイズ">원하는 디자인 및 대략적인 크기</label>
                        <textarea id="design" name="design" rows="4" placeholder="Describe the design and size..." required></textarea>
                    </div>

                    <button type="submit" class="submit-btn" data-en="Join Waitlist" data-ko="대기열 참가" data-jp="ウェイトリストに参加">대기열 참가</button>
                </form>

                <p class="form-message" data-en="I'll get back to you soon!" data-ko="곧 연락드리겠습니다!" data-jp="すぐにお返事します！">곧 연락드리겠습니다!</p>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p data-en="무라 © 2025" data-ko="무라 © 2025" data-jp="무라 © 2025">무라 © 2025</p>
            <p data-en="Custom Tattoo Designs" data-ko="커스텀 타투 디자인" data-jp="カスタムタトゥーデザイン">커스텀 타투 디자인</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
