<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow, noai, noimageai">
    <title>orbit - mura</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .orbit-vase { position: relative; width: 100%; margin: 2.5rem auto; }
        .orbit-ring {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            text-decoration: none;
        }
        .orbit-ring svg { display: block; overflow: visible; }
        .orbit-ring text {
            fill: var(--text);
            font-family: inherit;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .orbit-ring:hover text { fill: var(--greyish-azure); }
    </style>
</head>
<body>
    <div id="site-header"></div>

    <main class="container">
        <div id="orbit-vase" class="orbit-vase"></div>
    </main>

    <script src="script.js"></script>
    <script>
    (function () {
        const items = [
            { label: 'notice',       href: 'notice.html' },
            { label: 'mini-tattoos', href: 'mini-tattoos.html' },
            { label: 'episodes',     href: 'episodes.html' },
            { label: 'mura-types',   href: 'mura-types.html' },
            { label: 'archives',     href: 'archives.html' }
        ];
        // symmetric vase: narrow at top & base, widest in the middle
        const vaseW = (p) => 0.34 + 0.66 * Math.sin(Math.PI * p);

        function build() {
            const host = document.getElementById('orbit-vase');
            if (!host) return;
            const W = host.clientWidth || 360;
            const maxRx = Math.min(W * 0.46, 360);
            const ry = Math.max(20, Math.min(30, W * 0.07));
            const N = items.length;
            const stepY = ry * 1.85;            // overlap for a 3D stack
            host.innerHTML = '';
            host.style.height = ((N - 1) * stepY + ry * 2 + 40) + 'px';

            items.forEach((it, i) => {
                const p = N > 1 ? i / (N - 1) : 0.5;
                const rx = Math.max(64, Math.round(vaseW(p) * maxRx));
                const cx = rx + 14, cy = ry + 14;
                const w = rx * 2 + 28, h = ry * 2 + 28;
                const perim = Math.PI * (3 * (rx + ry) - Math.sqrt((3 * rx + ry) * (rx + 3 * ry)));
                const unit = it.label + '   ·   ';
                const reps = Math.max(2, Math.ceil(perim / (unit.length * 7)) + 1);
                const txt = unit.repeat(reps);
                const dir = (i % 2) ? -1 : 1;   // alternate orbit direction
                const dur = (14 + i * 2).toFixed(0);
                const pid = 'orb' + i;

                const a = document.createElement('a');
                a.href = it.href;
                a.className = 'orbit-ring';
                a.style.width = w + 'px';
                a.style.height = h + 'px';
                a.style.top = (i * stepY) + 'px';
                a.style.zIndex = i; // lower rings draw on top -> front of the vase
                a.innerHTML =
                    '<svg viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">' +
                        '<defs><path id="' + pid + '" d="M ' + (cx - rx) + ' ' + cy + ' a ' + rx + ' ' + ry + ' 0 1 1 ' + (2 * rx) + ' 0 a ' + rx + ' ' + ry + ' 0 1 1 ' + (-2 * rx) + ' 0"/></defs>' +
                        '<text font-size="13"><textPath href="#' + pid + '" xlink:href="#' + pid + '" startOffset="0">' + txt +
                            '<animate attributeName="startOffset" from="0" to="' + (dir * perim).toFixed(1) + '" dur="' + dur + 's" repeatCount="indefinite"/>' +
                        '</textPath></text>' +
                    '</svg>';
                host.appendChild(a);
            });
        }

        window.addEventListener('load', build);
        window.addEventListener('resize', build);
        if (document.readyState !== 'loading') build();
    })();
    </script>
</body>
</html>
