<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow, noai, noimageai">
    <title>orbit - mura</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .orbit-stage {
            min-height: 78vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .orbit {
            position: relative;
            width: min(82vw, 520px);
            aspect-ratio: 1 / 1;
        }
        .orbit svg { width: 100%; height: 100%; overflow: visible; }
        .orbit .ring {
            transform-box: fill-box;
            transform-origin: center;
            animation: orbitspin 20s linear infinite;
        }
        .orbit .ring--rev { animation-duration: 30s; animation-direction: reverse; }
        @keyframes orbitspin { to { transform: rotate(360deg); } }
        .orbit text {
            fill: var(--text);
            font-family: inherit;
            font-weight: 600;
            letter-spacing: 2px;
        }
        .orbit .ring--rev text { fill: var(--greyish-azure); }
        .orbit-center {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .orbit-center a {
            font-size: 1.1rem;
            font-weight: 700;
            text-decoration: none;
            color: var(--text);
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <div id="site-header"></div>

    <main class="container">
        <div class="orbit-stage">
            <div class="orbit">
                <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
                    <defs>
                        <path id="ringA" d="M150,150 m-118,0 a118,118 0 1,1 236,0 a118,118 0 1,1 -236,0" />
                        <path id="ringB" d="M150,150 m-80,0 a80,80 0 1,1 160,0 a80,80 0 1,1 -160,0" />
                    </defs>
                    <g class="ring">
                        <text font-size="16"><textPath href="#ringA" xlink:href="#ringA" startOffset="0">mura · independent tattoo studio · seoul · mura · independent tattoo studio · seoul · </textPath></text>
                    </g>
                    <g class="ring ring--rev">
                        <text font-size="12"><textPath href="#ringB" xlink:href="#ringB" startOffset="0">book or enquire · 예약 혹은 문의 · book or enquire · 예약 혹은 문의 · </textPath></text>
                    </g>
                </svg>
                <div class="orbit-center"><a href="index.html">mura ®</a></div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
