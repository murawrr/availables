<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow, noai, noimageai">
    <title>availables - mura</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Shared header (rendered by script.js) -->
    <div id="site-header" data-back="index.html"></div>

    <main class="container">
        <section class="project">
            <div class="project-desc">
                <span class="desc-label">
                    <span class="dot"></span>
                    <span data-en="available designs" data-ko="도안">available designs</span>
                </span>
            </div>

            <div class="grid-tabs">
                <button type="button" class="grid-tab is-active" data-collection="available" data-en="available" data-ko="예약 가능">available</button>
                <button type="button" class="grid-tab" data-collection="archive" data-en="archive" data-ko="아카이브">archive</button>
            </div>

            <!-- The grid is built from gallery.js (window.GALLERY.*). -->
            <div class="image-grid" data-collection="available"></div>
        </section>
    </main>

    <script src="gallery.js"></script>
    <script src="script.js"></script>
</body>
</html>
