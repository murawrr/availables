<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waitlist - mura</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="site-header" data-back="index.html"></div>

    <main class="container">
        <section class="waitlist-section" id="waitlist">
            <div class="project-desc">
                <span class="desc-label">
                    <span class="dot"></span>
                    <span data-en="Join the Waitlist" data-ko="대기열에 참가하세요">Join the Waitlist</span>
                </span>
                <p data-en="Fill in the form below and I'll get back to you." data-ko="아래 양식을 작성해 주시면 연락드리겠습니다.">Fill in the form below and I'll get back to you.</p>
            </div>

            <!-- Success/Error Messages -->
            <div class="form-status">
                <div data-fs-success class="success-message" style="display: none;">
                    <p data-en="Thank you! I'll get back to you soon!" data-ko="감사합니다! 곧 연락드리겠습니다!">Thank you! I'll get back to you soon!</p>
                </div>
                <div data-fs-error class="error-message" style="display: none;"></div>
            </div>

            <form id="waitlistForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name" data-en="Name" data-ko="이름">Name</label>
                        <input type="text" id="name" name="name" data-fs-field required>
                        <span data-fs-error="name"></span>
                    </div>
                    <div class="form-group">
                        <label for="instagram" data-en="Instagram @" data-ko="인스타그램 @">Instagram @</label>
                        <input type="text" id="instagram" name="instagram" placeholder="@username" data-fs-field required>
                        <span data-fs-error="instagram"></span>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="city" data-en="City" data-ko="도시">City</label>
                        <input type="text" id="city" name="city" data-fs-field required>
                        <span data-fs-error="city"></span>
                    </div>
                    <div class="form-group">
                        <label for="country" data-en="Country" data-ko="국가">Country</label>
                        <input type="text" id="country" name="country" data-fs-field required>
                        <span data-fs-error="country"></span>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="design" data-en="Design You Want & Approx Size" data-ko="원하는 디자인 및 대략적인 크기">Design You Want & Approx Size</label>
                    <textarea id="design" name="design" rows="4" placeholder="Describe the design and size..." data-fs-field required></textarea>
                    <span data-fs-error="design"></span>
                </div>

                <div class="form-group full-width">
                    <label for="files" data-en="Upload Design Reference or Images" data-ko="디자인 참고 또는 이미지 업로드">Upload Design Reference or Images</label>
                    <input type="file" id="files" name="files" multiple accept="image/*,.pdf,.doc,.docx" data-fs-field>
                    <p class="file-help" data-en="You can upload multiple images or files (optional)" data-ko="여러 이미지 또는 파일을 업로드할 수 있습니다 (선택사항)">You can upload multiple images or files (optional)</p>
                    <span data-fs-error="files"></span>
                </div>

                <button type="submit" class="submit-btn" data-fs-submit-btn data-en="Join Waitlist" data-ko="대기열 참가">Join Waitlist</button>
            </form>
        </section>
    </main>

    <!-- Formspree Library -->
    <script>
        window.formspree = window.formspree || function () { (formspree.q = formspree.q || []).push(arguments); };
        formspree('initForm', { formElement: '#waitlistForm', formId: 'xojbgknk' });
    </script>
    <script src="https://unpkg.com/@formspree/ajax@1" defer></script>

    <script src="script.js"></script>
</body>
</html>
