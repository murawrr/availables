<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="index, follow, noai, noimageai">
    <title>Waitlist - mura</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="site-header" data-back="index.html"></div>

    <main class="container">
        <section class="waitlist-section" id="waitlist">
            <div class="project-desc">
                <span class="desc-label">
                    <span class="dot"></span>
                    <span data-en="Waitlist" data-ko="대기열">Waitlist</span>
                </span>
                <p data-en="Sign up to get notified when I'm in your area." data-ko="제가 여러분의 지역을 방문할 때 알림을 받아보세요.">Sign up to get notified when I'm in your area.</p>
            </div>

            <!-- Success/Error Messages -->
            <div class="form-status">
                <div data-fs-success class="success-message" style="display: none;">
                    <p data-en="Thank you! I'll get back to you soon!" data-ko="감사합니다! 곧 연락드리겠습니다!">Thank you! I'll get back to you soon!</p>
                </div>
                <div data-fs-error class="error-message" style="display: none;"></div>
            </div>

            <form id="waitlistForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name" data-en="Name" data-ko="이름">Name</label>
                        <input type="text" id="name" name="name" data-fs-field required>
                        <span data-fs-error="name"></span>
                    </div>
                    <div class="form-group">
                        <label for="contact" data-en="Instagram @ or Email" data-ko="인스타그램 @ 또는 이메일">Instagram @ or Email</label>
                        <input type="text" id="contact" name="contact" placeholder="@username / you@email.com" data-fs-field required>
                        <span data-fs-error="contact"></span>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="country" data-en="Country" data-ko="국가">Country</label>
                        <input type="text" id="country" name="country" data-fs-field required>
                        <span data-fs-error="country"></span>
                    </div>
                    <div class="form-group">
                        <label for="city" data-en="City" data-ko="도시">City</label>
                        <input type="text" id="city" name="city" data-fs-field required>
                        <span data-fs-error="city"></span>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="budget" data-en="Budget" data-ko="예산">Budget</label>
                    <input type="text" id="budget" name="budget" data-fs-field required>
                    <span data-fs-error="budget"></span>
                </div>

                <div class="form-group full-width">
                    <label for="design" data-en="(Optional) Design ideas" data-ko="(선택) 도안 아이디어">(Optional) Design ideas</label>
                    <textarea id="design" name="design" rows="3" data-fs-field></textarea>
                    <span data-fs-error="design"></span>
                </div>

                <button type="submit" class="submit-btn" data-fs-submit-btn data-en="Sign up" data-ko="신청하기">Sign up</button>
            </form>
        </section>
    </main>

    <!-- Formspree Library -->
    <script>
        window.formspree = window.formspree || function () { (formspree.q = formspree.q || []).push(arguments); };
        formspree('initForm', { formElement: '#waitlistForm', formId: 'xojbgknk' });
    </script>
    <script src="https://unpkg.com/@formspree/ajax@1" defer></script>

    <script src="schedule.js"></script>
    <script src="script.js"></script>
</body>
</html>
