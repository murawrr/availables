<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Option 1 — line-art vase</title>
<link rel="stylesheet" href="style.css">
<style>
    .badge {
        position: fixed; top: 0.5rem; left: 50%; transform: translateX(-50%);
        background: #2d362f; color: #edf2ee; padding: 0.3rem 0.9rem;
        font-size: 0.72rem; letter-spacing: 0.5px; border-radius: 999px; z-index: 9000;
    }
    .stage { display: flex; justify-content: center; padding: 1.5rem 1rem 5rem; }
    .vase-wrap { position: relative; width: min(86vw, 360px); }
    .vase-wrap svg { display: block; width: 100%; height: auto; overflow: visible; }
    .vase-line { fill: rgba(155,177,165,0.07); stroke: #7e9389; stroke-width: 1.4; }
    .menu-item {
        position: absolute; left: 0; right: 0; text-align: center;
        transform: translateY(-50%);
        font-family: 'Noto Serif KR', Georgia, serif; font-weight: 600;
        font-size: clamp(1rem, 4.6vw, 1.45rem); letter-spacing: 3px;
        color: #2d362f; text-decoration: none; cursor: pointer;
        transition: opacity 0.2s ease, letter-spacing 0.2s ease;
    }
    .menu-item:hover { opacity: 0.5; letter-spacing: 5px; }
</style>
</head>
<body>
    <span class="badge">Option 1 · line-art vase</span>
    <header class="site-header">
        <div class="header-left"><a href="index.html" class="site-name">mura</a></div>
        <div class="header-right"><span class="header-action">예약 혹은 문의</span></div>
    </header>

    <main class="stage">
        <div class="vase-wrap" id="wrap">
            <svg id="svg" viewBox="0 0 360 600" preserveAspectRatio="xMidYMid meet">
                <path id="outline" class="vase-line"></path>
            </svg>
            <a class="menu-item" style="top:30.5%">공지사항</a>
            <a class="menu-item" style="top:42%">미니 타투</a>
            <a class="menu-item" style="top:53.5%">에피소드</a>
            <a class="menu-item" style="top:65%">무라체</a>
            <a class="menu-item" style="top:76.5%">아카이브</a>
        </div>
    </main>

    <script>
    const PTS = [
        [0.000,0.150],[0.020,0.200],[0.045,0.150],[0.080,0.140],
        [0.150,0.420],[0.230,0.760],[0.300,0.940],[0.345,0.975],
        [0.430,0.955],[0.540,0.830],[0.650,0.680],[0.750,0.560],
        [0.840,0.495],[0.890,0.480],[0.930,0.560],[0.970,0.660],[1.000,0.640]
    ];
    function crom(P, p){
        if(p<=P[0][0]) return P[0][1];
        if(p>=P[P.length-1][0]) return P[P.length-1][1];
        let i=0; while(i<P.length-1 && p>P[i+1][0]) i++;
        const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(P.length-1,i+2)];
        const t=(p-p1[0])/(p2[0]-p1[0]),t2=t*t,t3=t2*t;
        return 0.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3);
    }
    function vasePath(cx, top, W, H){
        const N=200, r=[], l=[];
        for(let i=0;i<=N;i++){ const p=i/N, y=top+p*H, w=crom(PTS,p)*(W/2); r.push([cx+w,y]); l.push([cx-w,y]); }
        let d='M '+r[0][0].toFixed(1)+' '+r[0][1].toFixed(1);
        for(let i=1;i<r.length;i++) d+=' L '+r[i][0].toFixed(1)+' '+r[i][1].toFixed(1);
        for(let i=l.length-1;i>=0;i--) d+=' L '+l[i][0].toFixed(1)+' '+l[i][1].toFixed(1);
        return d+' Z';
    }
    document.getElementById('outline').setAttribute('d', vasePath(180, 18, 300, 564));
    </script>
</body>
</html>
